services:
  app:
    build:
      context: .
    image: hands-on-sit-fortaleza-2026:latest
    restart: unless-stopped
    init: true
    env_file:
      - ${APP_ENV_FILE:-.env}
    environment:
      HOSTNAME: 0.0.0.0
      PORT: 3000
      DATABASE_PATH: /app/data/hands-on.db
    ports:
      - "80:3000"
    volumes:
      - hands_on_data:/app/data
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - fetch('http://127.0.0.1:3000/api/health').then((response)=>{if(!response.ok)process.exit(1)}).catch(()=>process.exit(1))
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    security_opt:
      - no-new-privileges:true

volumes:
  hands_on_data:
